<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baseball Universe · Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-main: #020617;
      --bg-panel: #030712;
      --accent: #ef4444; /* RED for baseball */
      --accent-soft: rgba(239, 68, 68, 0.25);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1120 0, var(--bg-main) 45%, #000 100%);
      color: var(--text-main);
    }

    header {
      background: #190707;
      padding: 22px 40px;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 14px var(--accent);
    }

    nav {
      margin-top: 10px;
      display: flex;
      gap: 18px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1f2937;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-soft);
    }

    main {
      padding: 30px 40px;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-panel);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(0,0,0,0.5);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #1f2937;
    }

    th {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    tr:hover {
      background: rgba(239, 68, 68, 0.08);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      margin-top: 40px;
      border-top: 1px solid #1f2937;
    }
  </style>
</head>

<body>
  <header>
    <div class="title">Baseball Universe · Stats</div>
    <nav>
      <a href="../stats.html">Stats</a>
      <a href="../news.html">News</a>
      <a href="../standings.html">Standings</a>
      <a href="../schedule.html">Schedule</a>
      <a href="../../index.html">Back to Dashboard</a>
    </nav>
  </header>

  <main>
    <h2>Player Statistics</h2>

    <table>
      <tr>
        <th>Player</th>
        <th>Team</th>
        <th>AVG</th>
        <th>HR</th>
        <th>RBI</th>
        <th>Games</th>
      </tr>

      <!-- You will fill these in manually -->
      <tr>
        <td>Example Player</td>
        <td>Example Ball Club</td>
        <td>.315</td>
        <td>22</td>
        <td>67</td>
        <td>81</td>
      </tr>
    </table>
  </main>

  <footer>
    Baseball Universe Stats · Updated Weekly
  </footer>
</body>
</html>
